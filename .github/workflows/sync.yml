name: Sync shared files

on:
  push:
    branches: [main]
    paths:
      - common.mk
      - .github/sync.yml
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs: overlapping syncs would race on the same branches in the
# target repos.
concurrency:
  group: sync-shared-files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: BetaHuhn/repo-file-sync-action@8b92be3375cf1d1b0cd579af488a9255572e4619 # v1.21.1
        with:
          # Fine-grained PAT with contents + pull-requests write on the repos
          # in .github/sync.yml. GITHUB_TOKEN cannot open PRs in other repos.
          GH_PAT: ${{ secrets.SYNC_PAT }}
          COMMIT_PREFIX: "build:"
          PR_LABELS: dependencies
          COMMIT_EACH_FILE: false
